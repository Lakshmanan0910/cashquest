<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in – Laksh Quest</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-auth">
  <div id="nav"></div>
  <main class="container auth-wrap">
    <div class="card auth-card">
      <h1>Welcome back 👋</h1>
      <p class="sub">Log in to continue your quest.</p>
      <form id="form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required />
        <label class="showpw"><input type="checkbox" id="showpw" /> Show password</label>
        <p class="form-error" id="err"></p>
        <button class="btn btn-primary btn-block" type="submit" id="go">Log in</button>
      </form>
      <p class="or">— or —</p>
      <button class="btn btn-ghost btn-block" id="demo" type="button">🎮 Use the demo account</button>
      <p class="alt">New here? <a href="/register.html">Create an account</a></p>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script>
    (async () => {
      const u = await renderPublicNav();
      if (u) { location.replace('/dashboard.html'); return; }
      const form = $('#form'), err = $('#err'), go = $('#go');
      async function login(email, password) {
        err.textContent = ''; go.disabled = true;
        try {
          await POST('/api/auth/login', { email, password });
          location.href = '/dashboard.html';
        } catch (e) { err.textContent = e.message; go.disabled = false; }
      }
      form.addEventListener('submit', e => {
        e.preventDefault();
        const email = form.email.value.trim(), pw = form.password.value;
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { err.textContent = 'Please enter a valid email address.'; form.email.focus(); return; }
        if (!pw) { err.textContent = 'Please enter your password.'; form.password.focus(); return; }
        login(email, pw);
      });
      $('#showpw').addEventListener('change', e => { form.password.type = e.target.checked ? 'text' : 'password'; });
      $('#demo').addEventListener('click', () => {
        form.email.value = 'demo@cashquest.com'; form.password.value = 'demo123';
        login('demo@cashquest.com', 'demo123');
      });
    })();
  </script>
</body>
</html>
