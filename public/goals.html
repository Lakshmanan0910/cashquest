<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Goals – CashQuest</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-goals">
  <div id="nav"></div>
  <main class="page container">
    <div class="page-head">
      <div><h1>🎯 Savings goals</h1><p>Pick something you want, then save towards it one step at a time.</p></div>
      <span class="chip" id="wallet">👛 Wallet: …</span>
    </div>

    <div class="grid g-side">
      <section class="card">
        <h2>✨ New goal</h2>
        <form id="goalForm" novalidate>
          <label>Pick an icon</label>
          <div class="emoji-pick" id="emojis"></div>
          <label for="title">What are you saving for?</label>
          <input id="title" name="title" maxlength="40" placeholder="e.g. Gaming headphones" required />
          <label for="target">Target amount (₹)</label>
          <input id="target" name="target" type="number" min="1" step="1" placeholder="e.g. 2500" required />
          <label for="date">Target date <span class="muted">(optional)</span></label>
          <input id="date" name="date" type="date" />
          <p class="form-error" id="gerr"></p>
          <button class="btn btn-primary btn-block" type="submit">Create goal</button>
        </form>
      </section>

      <section>
        <div class="grid g2" id="goalGrid"></div>
        <p class="empty card hidden" id="noGoals"><span class="big">🎯</span>No goals yet. Create your first one on the left!</p>
      </section>
    </div>
  </main>
  <div id="toasts"></div>

  <script src="js/app.js"></script>
  <script src="js/goals.js"></script>
</body>
</html>
