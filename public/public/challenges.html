<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quests – Laksh Quest</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-challenges">
  <div id="nav"></div>
  <main class="page container">
    <div class="page-head">
      <div><h1>🏆 Quests &amp; badges</h1><p>Take on challenges, earn XP and collect badges.</p></div>
    </div>

    <section class="card hero-level" id="hero"></section>

    <h2 class="mt" style="font-size:1.2rem">⚔️ Active quests</h2>
    <div class="grid g3" id="active" style="margin-top:12px"></div>
    <p class="empty card hidden" id="noActive"><span class="big">🗺️</span>No active quests. Join one below!</p>

    <h2 class="mt" style="font-size:1.2rem">📜 Available quests</h2>
    <div class="grid g3" id="available" style="margin-top:12px"></div>
    <p class="empty card hidden" id="noAvail"><span class="big">🎉</span>You have joined every quest. Legend!</p>

    <h2 class="mt" style="font-size:1.2rem">✅ Completed</h2>
    <div class="grid g3" id="done" style="margin-top:12px"></div>
    <p class="empty card hidden" id="noDone"><span class="big">🕐</span>Nothing completed yet. Your first win is close!</p>

    <section class="card mt">
      <h2>🏅 Badge wall <span class="sub" id="badgeCount"></span></h2>
      <div class="badges" id="badges"></div>
    </section>
  </main>
  <div id="toasts"></div>

  <script src="js/app.js"></script>
  <script src="js/challenges.js"></script>
</body>
</html>
