<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Money – Laksh Quest</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-money">
  <div id="nav"></div>
  <main class="page container">
    <div class="page-head">
      <div><h1>💸 Money</h1><p>Add income and spending, and look back at your history.</p></div>
    </div>

    <div class="grid g-side">
      <section class="card">
        <h2>➕ Add a transaction</h2>
        <div id="addForm"></div>
      </section>

      <section class="card">
        <h2>📜 History <span class="sub" id="count"></span></h2>
        <div class="filters">
          <div><label for="fType">Type</label>
            <select id="fType"><option value="">All</option><option value="expense">Expenses</option><option value="income">Income</option></select></div>
          <div><label for="fCat">Category</label><select id="fCat"></select></div>
          <div><label for="fMonth">Month</label><input type="month" id="fMonth" /></div>
          <div><label for="fQ">Search notes</label><input type="search" id="fQ" placeholder="e.g. pizza" /></div>
        </div>
        <div class="chips" id="totals" style="margin-bottom:12px"></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>What</th><th>Type</th><th class="num">Amount</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="empty hidden" id="none"><span class="big">🔍</span>No transactions match these filters.</p>
      </section>
    </div>
  </main>
  <div id="toasts"></div>

  <script src="js/app.js"></script>
  <script src="js/transactions.js"></script>
</body>
</html>
