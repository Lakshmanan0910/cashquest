<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up – Laksh Quest</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-auth">
  <div id="nav"></div>
  <main class="container auth-wrap">
    <div class="card auth-card">
      <h1>Create your account 🚀</h1>
      <p class="sub">Free forever. Start earning XP in a minute.</p>
      <form id="form" novalidate>
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" maxlength="40" autocomplete="name" placeholder="e.g. Arjun" required />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        <div class="form-row">
          <div><label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Min 6 characters" required /></div>
          <div><label for="confirm">Confirm</label>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Repeat it" required /></div>
        </div>
        <label class="showpw"><input type="checkbox" id="showpw" /> Show passwords</label>
        <p class="form-error" id="err"></p>
        <button class="btn btn-hot btn-block" type="submit" id="go">Create account</button>
      </form>
      <p class="alt">Already playing? <a href="/login.html">Log in</a></p>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script>
    (async () => {
      const u = await renderPublicNav();
      if (u) { location.replace('/dashboard.html'); return; }
      const form = $('#form'), err = $('#err'), go = $('#go');
      $('#showpw').addEventListener('change', e => { form.password.type = form.confirm.type = e.target.checked ? 'text' : 'password'; });
      form.addEventListener('submit', async e => {
        e.preventDefault(); err.textContent = '';
        if (form.name.value.trim().length < 2) { err.textContent = 'Please enter your name (at least 2 letters).'; form.name.focus(); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(form.email.value.trim())) { err.textContent = 'Please enter a valid email address.'; form.email.focus(); return; }
        if (form.password.value.length < 6) { err.textContent = 'Password must be at least 6 characters.'; form.password.focus(); return; }
        if (form.password.value !== form.confirm.value) { err.textContent = 'The two passwords do not match.'; return; }
        go.disabled = true;
        try {
          await POST('/api/auth/register', { name: form.name.value, email: form.email.value, password: form.password.value });
          location.href = '/dashboard.html';
        } catch (ex) { err.textContent = ex.message; go.disabled = false; }
      });
    })();
  </script>
</body>
</html>
